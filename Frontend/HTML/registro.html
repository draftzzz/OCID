<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - OCID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>
    <div class="register-container">
        <div class="register-header">
            <i class="fas fa-user-plus"></i>
            <h1>Crear Cuenta</h1>
            <p>Únete a la comunidad de OCID</p>
        </div>

        <div class="register-form">
            <form id="registro">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre"
                        placeholder="Juan Pérez González" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email"
                        placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena"
                        placeholder="••••••••" minlength="6" required>
                </div>

                <button type="submit" class="btn" id="registerBtn">
                    Registrarse
                </button>
            </form>
        </div>

        <div class="register-footer">
            <p>¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registro').addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const respuesta = await fetch('https://ocid.onrender.com/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre: document.getElementById('nombre').value,
                        email: document.getElementById('email').value,
                        contrasena: document.getElementById('contrasena').value
                    })
                });

                const data = await respuesta.json();

                if (respuesta.ok && data.success) {
                    alert('¡Registro exitoso!');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Error al registrar');
                }

            } catch (error) {
                alert('Error de conexión con el servidor');
                console.error(error);
            }
        });
    </script>
</body>
</html>
