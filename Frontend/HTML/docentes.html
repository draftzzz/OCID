<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>OCID - Gestión de Docentes</title>

    <!-- Iconografía FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <!-- Hoja de Estilos Única -->
    <link rel="stylesheet" href="css/docentes.css" />
</head>

<body>
    <!-- BEGIN: Sidebar -->
    <aside class="barra_lateral" data-purpose="navegacion-principal">
        <div class="encabezado_logo">
            <div class="icono_escudo">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <div>
                <div class="texto_logo_titulo">OCID</div>
                <div class="texto_logo_subtitulo">Plataforma de Coordinación Escolar</div>
            </div>
        </div>

        <nav class="navegacion_lateral">
            <a class="enlace_navegacion" href="inicio.html" id="nav_inicio">
                <i class="fa-solid fa-house icono_nav"></i>
                <span>Inicio</span>
            </a>
            <a class="enlace_navegacion" href="mi-departamento.html" id="nav_departamento">
                <i class="fa-solid fa-building-user icono_nav"></i>
                <span>Mi Departamento</span>
            </a>
            <a class="enlace_navegacion" href="anuncios.html" id="nav_anuncios">
                <i class="fa-solid fa-bullhorn icono_nav"></i>
                <span>Anuncios</span>
                <span class="insignia_notificacion" id="badge_conteo_anuncios">3</span>
            </a>
            <a class="enlace_navegacion" href="archivos.html" id="nav_archivos">
                <i class="fa-regular fa-folder-open icono_nav"></i>
                <span>Archivos</span>
            </a>
            <a class="enlace_navegacion activo" href="docentes.html" id="nav_docentes">
                <i class="fa-solid fa-users-gear icono_nav"></i>
                <span>Docentes</span>
            </a>
            <a class="enlace_navegacion" href="calendario.html" id="nav_calendario">
                <i class="fa-regular fa-calendar-days icono_nav"></i>
                <span>Calendario</span>
            </a>
            <a class="enlace_navegacion" href="tareas.html" id="nav_asistente">
                <i class="fa-regular fa-list-check icono_nav"></i>
                <span>Tareas</span>
            </a>
            <a class="enlace_navegacion" href="notificaciones.html">
                <i class="fa-solid fa-bell icono_nav"></i>
                <span>Notificaciones</span>
            </a>
            <div class="separador_menu"></div>
            <a class="enlace_navegacion" href="mi-perfil.html">
                <i class="fa-solid fa-user icono_nav"></i>
                <span>Mi perfil</span>
            </a>
            <a class="boton_cerrar_sesion" id="boton_cerrar_sesion" onclick="cerrarSesion()">
                <i class="fa-solid fa-arrow-right-from-bracket icono_nav"></i>
                <span>Cerrar sesión</span>
            </a>
        </nav>
    </aside>
    <!-- END: Sidebar -->

    <!-- BEGIN: MainContentArea -->
    <main class="area_principal">
        <header class="barra_superior" data-purpose="cabecera_global">
            <div class="seccion_superior_izquierda">
                <button aria-label="Menu" class="boton_menu_hamburguesa" title="Alternar menú lateral">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="contenedor_busqueda">
                    <i class="fa-solid fa-magnifying-glass icono_busqueda"></i>
                    <input class="campo_busqueda" id="campo_busqueda_general" placeholder="Buscar..." type="text" />
                </div>
            </div>
            <div class="seccion_superior_derecha">
                <button class="boton_notificaciones" title="Notificaciones del sistema">
                    <i class="fa-regular fa-bell"></i>
                    <span class="punto_notificacion" id="indicador_notificaciones">3</span>
                </button>
                <div class="perfil_usuario_barra">
                    <div class="avatar_usuario" id="avatar_usuario_circulo">CR</div>
                    <div class="detalles_usuario">
                        <strong id="nombreUsuario" style="color: #ffffff;">Cargando...</strong>
                        <span class="rol_usuario_texto" id="etiqueta_rol_usuario"></span>
                    </div>
                </div>
            </div>
        </header>

        <div class="cuerpo_pagina">
            <!-- Encabezado y Acción -->
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <div>
                    <h1 style="font-size: 22px; font-weight: 700;">Docentes</h1>
                    <p style="font-size: 13px; color: #64748b;">Gestiona la información de los docentes del plantel.</p>
                </div>
                <button class="boton_nuevo_evento" style="width: auto; padding: 0 16px; margin: 0;">
                    <i class="fa-solid fa-plus"></i> Nuevo docente
                </button>
            </div>

            <!-- Filtros Adaptares -->
            <div class="barra_filtros">
                <div class="filtro_buscador_contenedor">
                    <i class="fa-solid fa-magnifying-glass icono_buscador_filtro"></i>
                    <input class="input_filtro_nombre" id="input_buscar_docente" placeholder="Buscar por nombre..." type="text" />
                </div>
                <select class="select_filtro" id="select_filtro_depto">
                    <option value="">Todos los departamentos</option>
                </select>
                <select class="select_filtro" id="select_filtro_estado">
                    <option value="">Todos los estados</option>
                </select>
            </div>

            <!-- Tabla Adaptable -->
            <div class="contenedor_tabla">
                <table class="tabla_docentes">
                    <thead class="encabezado_tabla">
                        <tr>
                            <th class="celda_encabezado">Nombre</th>
                            <th class="celda_encabezado">Correo</th>
                            <th class="celda_encabezado">Rol</th>
                            <th class="celda_encabezado">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="contenedor_lista_docentes">
                        <!-- Carga dinámica vía JS -->
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <div class="barra_paginacion">
                <span class="texto_paginacion" id="texto_conteo_docentes">Cargando docentes...</span>
                <div class="botones_paginacion_grupo" id="contenedor_paginacion">
                    <!-- Botones dinámicos -->
                </div>
            </div>
        </div>
    </main>
    <script src="js/docentes.js"></script>
</body>

</html>
