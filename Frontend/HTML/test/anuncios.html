<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuncios | OCID - CBTIS 258</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../test/test2.css">
  <style>
    .pagina_anuncios { padding: 28px; }
    .cabecera_pagina_anuncios { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
    .cabecera_pagina_anuncios h1 { margin:0 0 7px; }
    .texto_vacio { padding:24px; text-align:center; color:#64748b; }
    .lista_anuncios_completa { display:flex; flex-direction:column; gap:14px; }
    .tarjeta_anuncio_completa { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; box-shadow:0 4px 14px rgba(15,23,42,.04); }
    .fila_anuncio_completa { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .tarjeta_anuncio_completa h2 { margin:10px 0; font-size:18px; color:#172033; }
    .contenido_anuncio_completo { color:#475569; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; }
    .meta_anuncio_completo { color:#64748b; font-size:13px; margin-top:14px; }
    .boton_eliminar_completo { border:0; border-radius:9px; padding:10px 12px; cursor:pointer; color:#b91c1c; background:#fee2e2; }
    .boton_nuevo_anuncio { border:0; border-radius:10px; padding:12px 16px; background:#4f46e5; color:white; cursor:pointer; font-weight:600; }
    .formulario_anuncio_pagina { display:grid; gap:15px; margin-bottom:22px; }
    .formulario_anuncio_pagina[hidden] { display:none; }
    @media(max-width:700px) { .pagina_anuncios { padding:16px; } .fila_anuncio_completa { flex-direction:column; } }
  </style>
</head>
<body>
  <aside class="barra_lateral">
    <div class="encabezado_logo"><div class="icono_escudo"><i class="fa-solid fa-layer-group"></i></div><div><div class="texto_logo_titulo">CBTIS 258</div><div class="texto_logo_subtitulo">Plataforma de Coordinación Escolar</div></div></div>
    <nav class="navegacion_lateral">
      <a class="enlace_navegacion" href="test2.html"><i class="fa-solid fa-house icono_nav"></i><span>Inicio</span></a>
      <a class="enlace_navegacion activo" href="anuncios.html"><i class="fa-solid fa-bullhorn icono_nav"></i><span>Anuncios</span><span class="insignia_notificacion" id="conteo_anuncios_pagina">—</span></a>
    </nav>
    <div class="pie_lateral"><button class="boton_cerrar_sesion" onclick="cerrarSesionAnuncios()"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Cerrar sesión</span></button></div>
  </aside>
  <main class="area_principal">
    <header class="barra_superior">
      <div class="seccion_superior_izquierda"><div><h2 style="margin:0;color:white">Anuncios</h2></div></div>
      <div class="seccion_superior_derecha"><div class="perfil_usuario_barra"><div class="avatar_usuario"><i class="fa-regular fa-user"></i></div><div class="detalles_usuario"><strong id="nombreUsuarioAnuncios" style="color:white">Usuario</strong><span class="rol_usuario_texto" id="rolUsuarioAnuncios"></span></div></div></div>
    </header>
    <div class="cuerpo_dashboard pagina_anuncios">
      <div class="cabecera_pagina_anuncios"><div><h1 class="saludo_titulo">Todos los anuncios</h1><p class="saludo_subtitulo">Consulta los avisos publicados en OCID.</p></div><button class="boton_nuevo_anuncio" onclick="mostrarFormularioAnuncio()"><i class="fa-solid fa-plus"></i> Nuevo anuncio</button></div>
      <section class="bloque_blanco_anuncios" style="padding:22px;margin-bottom:22px">
        <form id="formularioAnuncioPagina" class="formulario_anuncio_pagina" hidden onsubmit="publicarAnuncioPagina(event)">
          <div class="grupo_formulario"><label class="etiqueta_formulario" for="tituloAnuncioPagina">Título</label><input class="campo_formulario" id="tituloAnuncioPagina" required maxlength="200"></div>
          <div class="grupo_formulario"><label class="etiqueta_formulario" for="prioridadAnuncioPagina">Prioridad</label><select class="campo_formulario" id="prioridadAnuncioPagina"><option value="Importante">Importante</option><option value="Aviso" selected>Aviso</option><option value="General">General / Informativo</option></select></div>
          <div class="grupo_formulario"><label class="etiqueta_formulario" for="contenidoAnuncioPagina">Contenido</label><textarea class="campo_formulario" id="contenidoAnuncioPagina" rows="4" required></textarea></div>
          <div class="grupo_formulario"><label class="etiqueta_formulario" for="departamentoAnuncioPagina">Departamento</label><select class="campo_formulario" id="departamentoAnuncioPagina" required><option value="">Cargando departamentos...</option></select></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="boton_guardar_modal" type="submit" id="guardarAnuncioPagina"><i class="fa-solid fa-paper-plane"></i> Publicar</button><button class="boton_cancelar_modal" type="button" onclick="ocultarFormularioAnuncio()">Cancelar</button></div>
        </form>
        <div id="listaAnunciosPagina" class="lista_anuncios_completa"><p class="texto_vacio">Cargando anuncios...</p></div>
      </section>
    </div>
  </main>
  <div class="toast_alerta" id="avisoAnunciosPagina"><i class="fa-solid fa-circle-check" id="iconoAvisoAnuncios"></i><span id="textoAvisoAnuncios"></span></div>
  <script src="anuncios.js" defer></script>
</body>
</html>
