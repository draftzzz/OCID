<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - OCID</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <style>
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-sign-in-alt"></i>
            <h1>Iniciar Sesión</h1>
            <p>Accede a tu cuenta de OCID</p>
        </div>

        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail"
                        placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword"
                        placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>¿No tienes una cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const contrasena = document.getElementById('loginPassword').value;

            try {
                const respuesta = await fetch('http://ocid.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        contrasena: contrasena
                    })
                });

                const data = await respuesta.json();

                if (respuesta.ok && data.success) {
                    localStorage.setItem('id', data.usuario.id);
                    localStorage.setItem('usuario', data.usuario.nombre);

                    alert('¡Bienvenido, ' + data.usuario.nombre + '!');

                    window.location.href = 'inicio.html';
                } else {
                    alert(data.error || 'Correo o contraseña incorrectos');
                }
            } catch (error) {
                alert('Error al conectar con el servidor');
                console.log(error);
            }
        });
    </script>
</body>
</html>
